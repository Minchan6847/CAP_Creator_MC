<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Info - CAP</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
    integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
    crossorigin="anonymous"></script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>

  <link href="./css/main.css" type="text/css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container">
    <div class="py-5 text-center">
      <img class="d-block mx-auto mb-4" src="./img/CAP.png" alt="" height="72" />
      <h2>CAP Creator</h2>
      <p class="lead">[Step 2] Info</p>
    </div>
    <form name="info" class="a">
      <div class="form-group col-md-4">
        <label class="field_label" for="select-language">사용언어(language)</label>
        <select name="select-language" id="select-language" class="form-control" data-mini="true" data-inline="true">
          <option value="Korean">한국어 (KR)</option>
          <option value="en-us">English (US)</option>
        </select>
      </div>
      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>재난 관련 정보</legend>
        <div class="row">
          <div class="form-group col-md-4">
            <label for="select-category" class="ui-hidden-accessible">대분류(category)</label>
            <select name="select-category" id="select-category" class="form-control" data-mini="true"
              data-native-menu="false">
              <option value="Geo">지질</option>
              <option value="Met">기상</option>
              <option value="Safety">안전</option>
              <option value="Security">안보</option>
              <option value="Rescue">구조</option>
              <option value="Fire">화재</option>
              <option value="Health">보건</option>
              <option value="Env">환경</option>
              <option value="Transport">교통</option>
              <option value="Infra">국가 기반 체계</option>
              <option value="CBRNE">화생방</option>
              <option value="Other">기타</option>
            </select>
          </div>
          <div class="form-group col-md-8">
            <label class="field_label" for="text-event">재난유형(event)</label>
            <input type="text" name="text-event" class="form-control" id="text-event" value=""
              placeholder="SEVERE THUNDERSTORM">
          </div>
        </div>
        <div class="row">
          <div class="form-group col-md-6">
            <label class="field_label" for="text-eventCode">재난코드(eventCode)</label>
            <input type="text" name="text-eventCode" id="text-eventCode" class="form-control" value="" placeholder="">
          </div>
          <div class="form-group col-md-6">
            <label class="field_label" for="text-headline">제목(headline)</label>
            <input type="text" name="text-headline" id="text-headline" class="form-control" value=""
              placeholder="SEVERE THUNDERSTORM WARNING">
          </div>
        </div>
        <div class="form-group">
          <label class="field_label" for="textarea-description">재난정보(description)</label>
          <textarea name="textarea-description" id="textarea-description" class="form-control" data-mini="true"
            placeholder="AT 254 PM PDT...NATIONAL WEATHER SERVI CE DOPPLER RADAR INDICATED A SEVERE"></textarea>
        </div>
        <div class="row">
          <div class="form-group col-md-6">
            <label class="field_label" for="text-area">피해지역(area)</label>
            <input type="text" name="text-area" id="text-area" class="form-control" value="" placeholder="">
          </div>
          <div class="form-group col-md-6">
            <label class="field_label" for="text-audience">수신대상(audience)</label>
            <input type="text" name="text-audience" id="text-audience" class="form-control" value="" placeholder="">
          </div>
        </div>
      </fieldset>

      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>시간 정보</legend>
        <div class="row">
          <div class="form-group col-md-4">
            <label for="datetime-local-effective" class="ui-hidden-accessible">발령시간(effective)</label>
            <input type="datetime-local" name="datetime-local-effective" id="datetime-local-effective"
              class="form-control" value="2020-09-27T15:15" placeholder="">
          </div>
          <div class="form-group col-md-4">
            <label for="datetime-local-onset" class="ui-hidden-accessible">위험발생시간(onset)</label>
            <input type="datetime-local" name="datetime-local-onset" id="datetime-local-onset" class="form-control"
              value="2020-09-27T15:15" placeholder="">
          </div>
          <div class="form-group col-md-4">
            <label for="datetime-local-expires" class="ui-hidden-accessible">경보만료시간(expires)</label>
            <input type="datetime-local" name="datetime-local-expires" id="datetime-local-expires" class="form-control"
              value="2020-09-27T15:15" placeholder="">
          </div>
        </div>

      </fieldset>

      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>경보 중요도</legend>
        <div class="row">
          <div class="form-group col-md-4">
            <label for="select-urgency" class="ui-hidden-accessible">대응긴급성(Urgency)</label>
            <select name="select-urgency" id="select-urgency" class="form-control" data-mini="true" data-inline="true">
              <option value="Immediate">즉각적인 대응이 필요함</option>
              <option value="Expected">한 시간 이내의 빠른 대응이 필요함</option>
              <option value="Future">근시일 내의 대응이 필요함</option>
              <option value="Past">대응이 필요 없음</option>
              <option value="Unknown">미상</option>
            </select>
          </div>
          <div class="form-group col-md-4">
            <label for="select-severity" class="ui-hidden-accessible">예상피해(Severity)</label>
            <select name="select-severity" id="select-severity" class="form-control" data-mini="true"
              data-inline="true">
              <option value="Extreme">이례적인 피해</option>
              <option value="Severe">심각한 피해</option>
              <option value="Moderate">피해 가능성 존재</option>
              <option value="Minor">피해 가능성 낮음</option>
              <option value="Unknown">미상</option>
            </select>
          </div>
          <div class="form-group col-md-4">
            <label for="select-certainty" class="ui-hidden-accessible">발생확률(Certainty)</label>
            <select name="select-certainty" id="select-certainty" class="form-control" data-mini="true"
              data-inline="true">
              <option value="Unknown">-발생 확률-</option>
              <option value="Observed">이미 발생하였거나 진행 중</option>
              <option value="Likely">50%를 초과하는 가능성</option>
              <option value="Possible">50% 이하의 가능성</option>
              <option value="Unlikely">희박한 가능성</option>
              <option value="Unknown">미상</option>
            </select>
          </div>
      </fieldset>

      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>대응 관련</legend>
        <div class="form-group">
          <label for="select-responseType" class="ui-hidden-accessible">대응유형(ResponseType)</label>
          <select name="select-responseType" id="select-responseType" class="form-control" data-mini="true"
            data-native-menu="false">
            <option value="None">미선택</option>
            <option value="Shelter">지역 대피소 또는 &lt;instruction&gt;에 있는 대피소로 대피</option>
            <option value="Evacuate">&lt;instruction&gt;의 내용에 따라 대피</option>
            <option value="Prepare">&lt;instruction&gt;의 내용을 따라 대비</option>
            <option value="Execute">&lt;instruction&gt;에 지시하는 사전에 작성된 계획을 수행</option>
            <option value="Avoid">&lt;instruction&gt;의 내용에 따라 사건을 피할 것</option>
            <option value="Monitor">&lt;instruction&gt;에 알려주는 정보 제공자로부터의 정보에 주의를 기울일 것</option>
            <option value="AllClear">본 사건은 더 이상 위험하지 않음. &lt;instruction&gt;에 설명한 대로 행동할 것</option>
            <option value="None">특별한 대응이 필요 없음</option>
            <option value="Assess">이 경보 메시지에 있는 정보를 평가할 것(이 값은 대국민 경보에 사용하지 말 것을 권장한다)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="field_label" for="text-instruction">대응요령(instruction)</label>
          <input type="text" name="text-instruction" id="text-instruction" class="form-control" value=""
            placeholder="TAKE COVER IN A SUBSTANTIAL SHELTER UNT IL THE STORM PASSES.">
        </div>
      </fieldset>

      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>추가 정보</legend>

        <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
          <legend>파라미터(parameter)</legend>
          <div class="row">
            <div class="form-group col-md-6">
              <label class="field_label" for="text-prameterValueName">데이터이름(valueName)</label>
              <input type="text" name="text-prameterValueName" id="text-prameterValueName" class="form-control" value=""
                placeholder="Magnitude">
            </div>
            <div class="form-group col-md-6">
              <label class="field_label" for="text-parameterValue">데이터값(value)</label>
              <input type="text" name="text-parameterValue" id="text-parameterValue" class="form-control" value=""
                placeholder="3.4 Ml">
            </div>
          </div>
        </fieldset>
        <div class="row">
          <div class="form-group col-md-6">
            <label class="field_label" for="text-resource">추가정보(resource)</label>
            <input type="text" name="text-resource" id="text-resource" class="form-control" value="" placeholder="">
          </div>
          <div class="form-group col-md-6">
            <label class="field_label" for="url-web">웹링크(web)</label>
            <input type="url" name="url-web" id="url-web" class="form-control" value="" placeholder="https://">
          </div>
        </div>
      </fieldset>

      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>발행자(행정)관련</legend>
        <div class="row">
          <div class="form-group col-md-6">
            <label class="field_label" for="text-senderName">발령자(senderName)</label>
            <input type="text" name="text-senderName" class="form-control" id="text-senderName" value=""
              placeholder="NATIONAL WEATHER SERVICE SACRAMENTO CA">
          </div>
          <div class="form-group col-md-6">
            <label class="field_label" for="text-contact">담당자(contact)</label>
            <input type="text" name="text-contact" class="form-control" id="text-contact" value=""
              placeholder="BARUFFALDI/JUSKIE">
          </div>
        </div>
      </fieldset>
    </form>
    <footer class="my-5 pt-5 text-muted text-center text-small">
			<p class="mb-1">COPYRIGHT © 2020 MINCHAN ALL RIGHTS RESERVED.</p>
		</footer>
  </div>
</body>

</html>
