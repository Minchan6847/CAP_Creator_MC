<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Header - CAP</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
    integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
    crossorigin="anonymous"></script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>

  <link href="./css/main.css" type="text/css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container">
    <div class="py-5 text-center">
      <img class="d-block mx-auto mb-4" src="./img/CAP.png" alt="" height="72" />
      <h2>CAP Creator</h2>
      <p class="lead">[Step 1] Header</p>
    </div>
    <form name="header" class="a">
      <div class="row">
        <div class="form-group col-md-4">
          <label class="field_label" for="text-identifier">식별자(identifier)</label>
          <input type="text" class="form-control" name="text-identifier" id="text-identifier" value=""
            placeholder="KSTO1055887203" />
        </div>
        <div class="form-group col-md-4">
          <label class="field_label" for="email-sender">송신자(sender)</label>
          <input type="email" class="form-control" name="email-sender" id="email-sender" value=""
            placeholder="KSTO@NWS.NOAA.GOV" />
        </div>
        <div class="form-group col-md-4">
          <label class="field_label" for="datetime-local-sent">송신시간(sent)</label>
          <input type="datetime-local" class="form-control" name="datetime-local-sent" id="datetime-local-sent"
            value="2020-09-27T15:15" placeholder="" />
        </div>
      </div>
      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>경보 업무</legend>

        <div class="row">
          <div class="form-group col-md-6">
            <label for="select-status" class="ui-hidden-accessible">문서용도(Status)</label>
            <select name="select-status" id="select-status" class="form-control" data-mini="true" data-inline="true">
              <option value="Actual">실제 상황</option>
              <option value="Exercise">훈련 상황</option>
              <option value="Test">시스템 시험</option>
              <option value="Draft">경보 서식</option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label for="select-msgType" class="ui-hidden-accessible">문서관리(msgType)</label>
            <select name="select-msgType" id="select-msgType" class="form-control" data-mini="true" data-inline="true">
              <option value="Alert">신규 경보</option>
              <option value="Update">경보 메시지 갱신</option>
              <option value="Cancel">경보 메시지 취소</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="field_label" for="text-references">참조(references)</label>
          <input type="text" class="form-control" name="text-references" id="text-references" value=""
            placeholder="trinet@caltech.edu,TRI13970876 .1,2003-06-11T20:30:00-07:00" />
        </div>
        <div class="form-group">
          <label class="field_label" for="textarea-note">노트(note)</label>
          <textarea name="textarea-note" id="textarea-note" class="form-control" data-mini="true"
            placeholder=""></textarea>
        </div>
      </fieldset>

      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>수신 제한</legend>
        <div class="row">
          <div class="form-group col-md-6">
            <label for="select-scope" class="ui-hidden-accessible">수신대상(Scope)</label>
            <select name="select-scope" id="select-scope" class="form-control" data-mini="true" data-inline="true">
              <option value="Public">일반인</option>
              <option value="Restricted">제한된 범위</option>
              <option value="Private">특정 주소</option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label class="field_label" for="text-restriction">특수수신자(restriction)</label>
            <input type="text" class="form-control" name="text-restriction" id="text-restriction" value=""
              placeholder="" />
          </div>
        </div>
        <div class="form-group">
          <label class="field_label" for="text-address">주소(address):</label>
          <input type="text" class="form-control" name="text-address" id="text-address" value="" placeholder="" />
        </div>
      </fieldset>

      <fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
        <legend>기타</legend>
        <div class="row">
          <div class="form-group col-md-4">
            <label class="field_label" for="text-source">근거(source)</label>
            <input type="text" class="form-control" name="text-source" id="text-source" value="" placeholder="" />
          </div>
          <div class="form-group col-md-4">
            <label class="field_label" for="text-code">처리코드(code)</label>
            <input type="text" class="form-control" name="text-code" id="text-code" value="" placeholder="" />
          </div>
          <div class="form-group col-md-4">
            <label class="field_label" for="text-incidents">사건이름(incidents)</label>
            <input type="text" class="form-control" name="text-incidents" id="text-incidents" value="" placeholder="" />
          </div>
        </div>
      </fieldset>
    </form>
    <footer class="my-5 pt-5 text-muted text-center text-small">
			<p class="mb-1">COPYRIGHT © 2020 MINCHAN ALL RIGHTS RESERVED.</p>
		</footer>
  </div>
</body>

</html>
