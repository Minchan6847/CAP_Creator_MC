<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<title>Area - CAP</title>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
		integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
		integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
		crossorigin="anonymous"></script>

	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
		integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
		integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
		crossorigin="anonymous"></script>

	<link href="./css/main.css" type="text/css" rel="stylesheet" />
</head>

<body class="bg-light">
	<div class="container">
		<div class="py-5 text-center">
			<img class="d-block mx-auto mb-4" src="./img/CAP.png" alt="" height="72" />
			<h2>CAP Creator</h2>
			<p class="lead">[Step 3] Area</p>
		</div>
		<form name="area" class="a">
			<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
				<legend>지역</legend>
				<div class="form-group">
					<label class="field_label" for="textarea-areaDesc">지역명(areaDesc)</label>
					<textarea name="textarea-areaDesc" id="textarea-areaDesc" class="form-control" data-mini="true"
						placeholder="EXTREME NORTH CENTRAL TUOLU MNE COUNTY IN CALIFORNIA, EXTREME NOR THEASTERN 915 CALAVERAS COUNTY IN CALI FORNIA, SOUTHWESTERN ALPINE COUNTY IN CALIFORNIA"></textarea>
				</div>
				<div class="row">
					<div class="form-group col-md-6">
						<label class="field_label" for="text-polygon">다각형(polygon)</label>
						<input type="text" name="text-polygon" id="text-polygon" class="form-control" value=""
							placeholder="38.47,-120.14 38.34,-119.95 38.52,-119.74 38.62,-119.89 38.47,-120.14" />
					</div>
					<div class="form-group col-md-6">
						<label class="field_label" for="text-circle">원(eventCode)</label>
						<input type="text" name="text-circle" id="text-circle" class="form-control" value=""
							placeholder="중심, 반지름" />
					</div>
				</div>
				<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
					<legend>지역코드(geocode)</legend>
					<div class="row">
						<div class="form-group col-md-6">
							<label class="field_label" for="text-geocodeValueName">데이터이름(valueName)</label>
							<input type="text" name="text-geocodeValueName" id="text-geocodeValueName" class="form-control" value=""
								placeholder="SAME" />
						</div>
						<div class="form-group col-md-6">
							<label class="field_label" for="text-geocodeValue">데이터값(value)</label>
							<input type="text" name="text-geocodeValue" id="text-geocodeValue" class="form-control" value=""
								placeholder="006003" />
						</div>
					</div>
				</fieldset>
			</fieldset>

			<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
				<legend>고도</legend>
				<div class="row">
					<div class="form-group col-md-6">
						<label class="field_label" for="text-altitude">고도(altitude)</label>
						<input type="text" name="text-altitude" id="text-altitude" class="form-control" value="" placeholder="" />
					</div>
					<div class="form-group col-md-6">
						<label class="field_label" for="text-ceiling">최고고도(ceiling)</label>
						<input type="text" name="text-ceiling" id="text-ceiling" class="form-control" value="" placeholder="" />
					</div>
				</div>
			</fieldset>
		</form>
		<footer class="my-5 pt-5 text-muted text-center text-small">
			<p class="mb-1">COPYRIGHT © 2020 MINCHAN ALL RIGHTS RESERVED.</p>
		</footer>
	</div>
</body>

</html>
